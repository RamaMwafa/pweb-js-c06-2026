<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <!-- Modal Keranjang Belanja -->
    <div id="cartModal" class="modal hidden">
      <div class="modal-content" style="color: #333">
        <span id="closeCartModal" class="close-btn">&times;</span>
        <h2 style="margin-top: 0">Keranjang Belanja</h2>
        <div id="cartBody">
          <!-- Isi keranjang akan dirender di sini -->
        </div>
        <button id="checkoutBtn" class="add-to-cart" style="margin-top: 20px; background-color: #f39c12; color: white">Checkout</button>
      </div>
    </div>
    <script src="product.js"></script>
  </body>
</html>
