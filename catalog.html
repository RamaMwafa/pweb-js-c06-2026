<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Katalog Produk</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="catalog-body">
  
  <!-- Navigation Bar -->
  <nav class="navbar catalog-navbar">
    <h2 id="welcomeMessage">Welcome to Mini Shopee</h2>
    <div class="nav-actions">
      <div id="cartIcon" class="cart-btn">
        🛒 <span id="cartBadge">0</span> item | $<span id="cartTotalHeader">0.00</span>
      </div>
      <button id="logoutBtn" class="logout-btn">Logout</button>
    </div>
  </nav>

  <div class="container catalog-container">
    <!-- Controls: Filter, Sort, Search -->
    <div class="controls-container">
      <div class="filter-group">
        <select id="categoryFilter" class="filter-dropdown">
          <option value="all">Semua Kategori</option>
        </select>
        <select id="sortFilter" class="filter-dropdown">
          <option value="default">Urutkan Terbaru</option>
          <option value="price-asc">Harga Termurah</option>
          <option value="price-desc">Harga Termahal</option>
        </select>
      </div>
      <input type="text" id="searchInput" class="search-bar" placeholder="Cari produk..." />
    </div>

    <!-- Product Grid -->
    <div id="productContainer" class="product-grid"></div>

    <!-- Tombol Load More (Pagination) -->
    <div class="load-more-container">
      <button id="loadMoreBtn" class="load-more-btn hidden-element">Load More</button>
    </div>
  </div>

  <!-- MODAL DETAIL PRODUK -->
  <div id="productModal" class="modal hidden-element">
    <div class="modal-content">
      <span id="closeModal" class="close-btn">&times;</span>
      <div id="modalBody"></div>
    </div>
  </div>

  <!-- MODAL KERANJANG -->
  <div id="cartModal" class="modal hidden-element">
    <div class="modal-content">
      <span id="closeCartModal" class="close-btn">&times;</span>
      <h2 class="modal-title">Keranjang Belanja</h2>
      <div id="cartBody" class="cart-body"></div>
      
      <!-- Action Buttons Keranjang -->
      <div id="cartActions" class="cart-actions hidden-element">
        <button id="cancelOrderBtn" class="cancel-btn">Batalkan Pesanan</button>
        <button id="checkoutBtn" class="checkout-btn">Checkout</button>
      </div>
    </div>
  </div>

  <script src="product.js"></script>
</body>
</html>
